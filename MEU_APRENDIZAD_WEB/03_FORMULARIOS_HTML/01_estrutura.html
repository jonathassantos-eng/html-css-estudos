<!DOCTYPE html> <html>
    <head>
        <meta charset="UTF-8">
        <title>Formulários</title>
    </head>

    <body>
        <form action="/pagina-processa-dados-do-formulario" method="post">
            <fieldset>
               
                <legend>Dados Gerais</legend>
                
                <label for="name">Nome:</label>
                <input type="text" minlength="3" id="name"/>
               
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento"/>
               
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf"/>
                
            </fieldset>
           
            <fieldset>
                <legend>Endereço</legend>
                <label
                for="tipo_endereco">Tipo:</label>
            
                <select type="text" id="tipo_endereco">
                    <option value="">Rua</option>
                    <option value="">Estrada</option>
                    <option value="">Rodovia</option>
                    <option value="">Outros</option>
                </select>
               
                <label
              
                for="logradouro_endereco">Logradouro:</label><input type="text" id="logradouro_endereco" name="logradouro_endereco" />
                
                <label for="numero_endereco">Número:</label>
                <input type="text" id="numero_endereco" name="numero_endereco"/>
               
                <label for="complemento_endereco">Complemento:</label>
                <input type="text" id="complemento_endereco" name="complemento_endereco"/>
                
            </fieldset>

            <fieldset>
                <legend>Fale Conosco</legend>
                <label
                for="msg">Mensagem:</label>
                <textarea type="text" id="msg">
                </textarea>
            </fieldset>

            <fieldset>
                <input type="checkbox" id="aceito_termos"/>
                <label for="aceito_termos">Aceito o uso dos meus dados de acordo com o que é permitido pelo Artg.000, l10, prg4.</label>
            </fieldset>

            <fieldset>
               <p>Ao aceitar, você concorda com os termos e condições de uso.</p>
            </fieldset>

            <fieldset>
                <button type="submit">Enviar sua Mensagem</button>
                <button type="reset">Limpar  Formulário</button>
            </fieldset>
        </form>
    </body>
</html>
