<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>CSS Interno</title>
    
        <style>

            body {
             background-color: #eef2f5;
             font-family: Arial, sans-serif;
             text-align: center;
             padding-top: 50px;
            }

            .cartao {
                background-color: #ffffff;
                border: 2px solid #3498db;
                border-radius: 8px;
                display: inline-block;
                padding: 20px;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            }

            .cartao h2 {
                color: #2c3e50;
            }

        </style>

    </head>
    
    <body>

        <div class="cartao">
            <h2>Estilo Interno</h2>
            <p>Estilos definidos diretamente na tag</p>
        </div>

    </body>

</html>
