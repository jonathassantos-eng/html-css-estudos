<!DOCTYPE html> <html>
    <head>
        <meta charset="UTF-8">
        <title>Tabelas</title>

    </head>

    <body>
         <h1> TABELAS </h1>
        <table>
            <tr>
                <td>Smith</td>
                <td>HTML</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Sunday</td>
                <td>JavaScript</td>
                <td>10</td>
            </tr>
        </table>

        <h2> TABELA COM TÍTULO </h2>
        <table>
            <tr>
                <td>Smith</td>
                <td>HTML</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Sunday</td>
                <td>JavaScript</td>
                <td>10</td>
            </tr>
        </table>

        <h2> TABELA COM CABEÇALHO E RODAPÉ </h2>
        <table width= "100%" border = "1">
            <thead>

                <tr>
                    <th>Mês</th>
                    <th>Horas/Aula</th>
                </tr> <tbody> 
                    
                <tr>
                    <td>Junho</td>
                    <td>50</td>
                </tr>
                <tr>
                    <td>Julho</td>
                    <td>50</td>
                </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td>Total</td>
                        <td>100</td>
                    </tr>
                </tfoot>
        </table>

        <h2> Tabela Simples </h2>
        <!-- Tabela com Conlspan -->
        <table width= "100%" border = "1">
            <thead>

                <tr>
                    <td>Aluno</td>
                    <td colspan="2">Discplina</td>
                </tr>

                <tr>
                    <td>Alex</td>
                    <td>HTML</td>
                    <td>Ambiente WEB</td>
                </tr>
        </table>

        <h2> Tabela Simples </h2>
        <!-- Tabela com Conlspan -->
        <table width= "100%" border = "1">
            <thead>

                <tr>
                    <td>Aluno</td>
                    <td rowspan="2">Discplina</td>
                </tr>

                <tr>
                    <td>Alex</td>
                    <td>HTML</td>
                    <td>Ambiente WEB</td>
                </tr>
        </table>
    </body>
</html>
